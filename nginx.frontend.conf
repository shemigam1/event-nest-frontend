server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Lightweight health check (used by Docker HEALTHCHECK + CloudFront) ──
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── SSE notifications stream ────────────────────────────────────────────
    # Must come BEFORE the generic /api/ block so its exact-match location wins.
    # SSE requires:
    #   - proxy_buffering off       → events stream as soon as the server flushes
    #   - chunked transfer + HTTP/1.1
    #   - long proxy_read_timeout   → connection isn't killed mid-stream
    location = /api/v1/notifications/stream {
        proxy_pass                http://app:8080/api/v1/notifications/stream;
        proxy_http_version        1.1;
        proxy_set_header          Host              $host;
        proxy_set_header          X-Real-IP         $remote_addr;
        proxy_set_header          X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header          X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header          Connection        '';
        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding on;
        proxy_read_timeout        3600s;
    }

    # ── Backend API proxy ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # ── Actuator (health/metrics — CloudFront health check hits this) ───────
    location /actuator/ {
        proxy_pass         http://app:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── WebSocket (SockJS / STOMP) ──────────────────────────────────────────
    # Spring Boot's SockJS endpoint responds to both HTTP long-poll and WS
    # upgrade requests — both need to reach the backend.
    location /ws {
        proxy_pass         http://app:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;  # keep WebSocket alive for 1 hour
    }

    # ── React SPA fallback ──────────────────────────────────────────────────
    # Any path that isn't a real file is served index.html so React Router
    # can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
